<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>History | EcoCycle Campus</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 0;
      border-bottom: 1px solid var(--border-color);
    }
    .history-item:last-child {
      border-bottom: none;
    }
    .filter-btn {
      padding: 0.5rem 1rem;
      border-radius: var(--radius-full);
      background: var(--warm-white);
      border: 1px solid var(--border-color);
      cursor: pointer;
      font-weight: 500;
      font-size: 0.875rem;
      transition: var(--transition);
    }
    .filter-btn.active {
      background: var(--forest-green);
      color: white;
      border-color: var(--forest-green);
    }
  </style>
</head>
<body data-page="history">
  <div class="app-container">
    
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
          EcoCycle
        </div>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item" data-target="dashboard">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          Dashboard
        </a>
        <a href="kiosks.html" class="nav-item" data-target="kiosks">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
          Kiosks & Deposit
        </a>
        <a href="rewards.html" class="nav-item" data-target="rewards">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"></path><path d="M4 6v12c0 1.1.9 2 2 2h14v-4"></path><path d="M18 12a2 2 0 0 0-2 2c0 1.1.9 2 2 2h4v-4h-4z"></path></svg>
          Rewards
        </a>
        <a href="impact.html" class="nav-item" data-target="impact">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20"></path><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
          Impact
        </a>
        <a href="history.html" class="nav-item" data-target="history">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
          History
        </a>
      </nav>
      <div class="sidebar-footer">
        <a href="profile.html" class="nav-item" data-target="profile">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          Profile
        </a>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="app-content">
      <header class="top-header">
        <h1 class="header-title">Transaction History</h1>
        <div class="header-actions">
          <div class="points-badge">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20"></path><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
            <span class="user-balance">0</span> pts
          </div>
        </div>
      </header>

      <main class="main-content">
        <div class="card">
          <div class="flex gap-2 mb-6">
            <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
            <button class="filter-btn" onclick="setFilter('deposit', this)">Deposits</button>
            <button class="filter-btn" onclick="setFilter('redemption', this)">Redemptions</button>
          </div>

          <div id="history-list">
            <!-- Populated via JS -->
          </div>
        </div>
      </main>
    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
      <a href="dashboard.html" class="bottom-nav-item" data-target="dashboard">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        <span>Home</span>
      </a>
      <a href="kiosks.html" class="bottom-nav-item" data-target="kiosks">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
        <span>Scan</span>
      </a>
      <a href="rewards.html" class="bottom-nav-item" data-target="rewards">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"></path><path d="M4 6v12c0 1.1.9 2 2 2h14v-4"></path><path d="M18 12a2 2 0 0 0-2 2c0 1.1.9 2 2 2h4v-4h-4z"></path></svg>
        <span>Rewards</span>
      </a>
      <a href="profile.html" class="bottom-nav-item" data-target="profile">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        <span>Profile</span>
      </a>
    </nav>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    let currentFilter = 'all';

    document.addEventListener('DOMContentLoaded', () => {
      renderHistory();
    });

    function setFilter(filter, btnElement) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');
      renderHistory();
    }

    function renderHistory() {
      const txs = store.getTransactions().map(tx => ({...tx, _kind: 'deposit'}));
      const vouchers = store.getVouchers().map(v => ({...v, _kind: 'redemption'}));
      
      let combined = [...txs, ...vouchers];
      
      // Sort by timestamp desc
      combined.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

      // Filter
      if (currentFilter !== 'all') {
        combined = combined.filter(item => item._kind === currentFilter);
      }

      const listEl = document.getElementById('history-list');
      listEl.innerHTML = '';

      if (combined.length === 0) {
        listEl.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            <p>No transactions found.</p>
          </div>
        `;
        return;
      }

      combined.forEach(item => {
        const isDeposit = item._kind === 'deposit';
        const date = new Date(item.timestamp).toLocaleString();
        
        let title, subtitle, amountClass, amountText, icon;
        
        if (isDeposit) {
          const cat = DEVICE_CATEGORIES.find(c => c.id === item.categoryId);
          title = `Deposited: ${cat ? cat.name : 'Device'}`;
          subtitle = `${date} &bull; ${item.kioskId} &bull; ID: ${item.id}`;
          amountClass = 'text-success';
          amountText = `+${item.points}`;
          icon = `<div style="background: var(--mint-green); border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; color: var(--forest-green);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></div>`;
        } else {
          title = `Redeemed: ${item.name}`;
          subtitle = `${date} &bull; ID: ${item.id}`;
          amountClass = 'text-danger';
          amountText = `-${item.cost}`;
          icon = `<div style="background: #FEF2F2; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; color: var(--danger);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"></path><path d="M4 6v12c0 1.1.9 2 2 2h14v-4"></path><path d="M18 12a2 2 0 0 0-2 2c0 1.1.9 2 2 2h4v-4h-4z"></path></svg></div>`;
        }

        listEl.innerHTML += `
          <div class="history-item">
            <div class="flex items-center gap-4">
              ${icon}
              <div>
                <p class="font-bold">${title}</p>
                <p class="text-sm text-muted">${subtitle}</p>
              </div>
            </div>
            <div class="${amountClass} font-bold" style="font-size: 1.125rem;">
              ${amountText}
            </div>
          </div>
        `;
      });
    }
  </script>
</body>
</html>
