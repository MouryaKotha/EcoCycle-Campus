    <!-- Main Content -->
    <div class="app-content">

        </div>
      </header>

      <main class="main-content">
        <div class="mb-8">
          <h2 class="mb-4">Available Vouchers</h2>
          <div class="grid grid-2" id="vouchers-grid">
            <!-- Populated via JS -->
          </div>
        </div>

        <div>
          <h2 class="mb-4">My Active Vouchers</h2>

            <!-- Populated via JS -->

        </div>
      </main>
    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
      <a href="dashboard.html" class="bottom-nav-item" data-target="dashboard">

        <span>Scan</span>

      <a href="rewards.html" class="bottom-nav-item" data-target="rewards">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"></path><path d="M4 6v12c0 1.1.9 2 2 2h14v-4"></path><path d="M18 12a2 2 0 0 0-2 2c0 1.1.9 2 2 2h4v-4h-4z"></path></svg>
        <span>Rewards</span>
      </a>
      <a href="profile.html" class="bottom-nav-item" data-target="profile">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        <span>Profile</span>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderAvailableVouchers();
      renderMyVouchers();
    });

    function renderAvailableVouchers() {
      const grid = document.getElementById('vouchers-grid');
      grid.innerHTML = '';
      const balance = store.getBalance();

      REWARD_VOUCHERS.forEach(v => {
        const canAfford = balance >= v.pointsCost;
        grid.innerHTML += `
          <div class="card flex justify-between items-center" style="border-left: 4px solid ${v.color};">
            <div>
              <h3 style="margin-bottom: 0.25rem;">${v.name}</h3>
              <p class="text-sm font-bold text-muted">${v.pointsCost} Points</p>
            </div>
            <button class="btn btn-primary" ${!canAfford ? 'disabled' : ''} onclick="handleRedeem('${v.id}')">Redeem</button>
          </div>
        `;
      });
    }

    function renderMyVouchers() {
      const grid = document.getElementById('my-vouchers-grid');
      const vouchers = store.getVouchers();
      grid.innerHTML = '';

      if (vouchers.length === 0) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"></path><path d="M4 6v12c0 1.1.9 2 2 2h14v-4"></path><path d="M18 12a2 2 0 0 0-2 2c0 1.1.9 2 2 2h4v-4h-4z"></path></svg>
            <p>You haven't redeemed any vouchers yet.</p>
          </div>
        `;
        return;
      }

      vouchers.forEach(v => {
        const def = REWARD_VOUCHERS.find(d => d.id === v.defId);
        grid.innerHTML += `
          <div class="card text-center" style="background: var(--dark-charcoal); color: white;">
            <div style="background: ${def.color}; width: 48px; height: 48px; border-radius: 50%; margin: 0 auto 1rem; display: flex; align-items: center; justify-content: center;">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"></path><path d="M4 6v12c0 1.1.9 2 2 2h14v-4"></path><path d="M18 12a2 2 0 0 0-2 2c0 1.1.9 2 2 2h4v-4h-4z"></path></svg>
            </div>
            <h4 class="mb-2">${v.name}</h4>
            <p class="text-sm mb-4" style="color: rgba(255,255,255,0.7);">ID: ${v.id}</p>
            <div style="background: rgba(255,255,255,0.1); padding: 0.5rem; border-radius: var(--radius-sm); font-size: 0.75rem;">
              Show this to cashier
            </div>
          </div>
        `;
      });
    }

    function handleRedeem(voucherId) {
      if (confirm('Are you sure you want to redeem this voucher? Points will be deducted immediately.')) {
        const result = store.redeemVoucher(voucherId);
        if (result.success) {
          showToast('Voucher redeemed successfully!');
          updateGlobalUI(); // updates top badge
          renderAvailableVouchers(); // re-evaluates buttons
          renderMyVouchers();
        } else {
          showToast(result.message, 'error');
        }
      }
    }
  </script>
</body>
</html>
